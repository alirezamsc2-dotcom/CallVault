# Android Debug Build Workflow
# Builds a debug APK on pushes to build-debug and on manual dispatch.
# Uses GitHub-hosted runners; no Android build tools are required on the developer's PC.

name: Android Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - build-debug

concurrency:
  group: android-debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Only install the SDK packages required by app/build.gradle.kts.
      # Use supported setup-android inputs; do not pass "tools" as a package.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.2.12479018
            cmake;3.22.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-provider: basic

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Print APK Info
        if: always()
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "APK size: $(du -h "$APK_PATH" | cut -f1)"
            echo "APK sha256: $(sha256sum "$APK_PATH" | cut -d' ' -f1)"
          else
            echo "APK not found at $APK_PATH"
            find app/build/outputs -name "*.apk" -type f 2>/dev/null || echo "No APKs found anywhere"
          fi
